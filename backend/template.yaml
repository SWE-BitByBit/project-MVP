AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  sam_local_backend
  Sample SAM Template for sam_local_backend

Globals:
  Function:
    Timeout: 3
    LoggingConfig:
      LogFormat: JSON

Resources:
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/hello_world/
      Handler: app.lambda_handler
      Runtime: python3.12
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LambdaDynamo-http-trusted-contacts-poc"
      Environment:
        Variables:
          TABLE_NAME: "trusted_contacts_poc"

Outputs:
  HelloWorldFunction:
    Description: Trusted Contacts Lambda Function ARN
    Value: !GetAtt HelloWorldFunction.Arn

