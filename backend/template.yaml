AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  This is the template for the deploy of the lambda used for app: "L'app che
  protegge e trasforma"

Globals:
  Function:
    Timeout: 10
    Runtime: python3.12
    LoggingConfig:
      LogFormat: JSON

Resources:
  DiaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/diary/
      Handler: app.lambda_handler
      FunctionName: lambda-diary-notes-microservice-mvp
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LambdaDynamo-lambda-diary-mvp"

  TrustedContactFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/trusted_contact/
      Handler: app.lambda_handler
      FunctionName: lambda-trusted-contact-microservice-mvp
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LambdaDynamo-lambda-trusted-con\
        tact-mvp"

  TrustedContactsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Delete
    Properties:
      TableName: trusted-contacts-mvp
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: contact_id
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: contact_id
          AttributeType: S
      SSESpecification:
        SSEEnabled: true

  ChatsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Delete
    Properties:
      TableName: chats_mvp
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: chat_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: chat_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  ChatsMessagesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Delete
    Properties:
      TableName: chats_messages_mvp
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: chat_id
          AttributeType: S
        - AttributeName: message_id
          AttributeType: S
      KeySchema:
        - AttributeName: chat_id
          KeyType: HASH
        - AttributeName: message_id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  GetMaterialsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: materials/lambda_handler.lambda_handler
      FunctionName: fetch-materials-mvp
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LambdaDynamo-http-notes-poc3"
      Environment:
        Variables:
          PYTHONPATH: "/var/task"

  GetSafePlacesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: safe_places/lambda_handler.lambda_handler
      FunctionName: fetch-safe-places-mvp
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LambdaDynamo-http-notes-poc3"
      Environment:
        Variables:
          PYTHONPATH: "/var/task"

  ChatbotFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: chatbot/lambda_function.lambda_handler
      FunctionName: lambda-chatbot-mvp
      Runtime: python3.14
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LambdaDynamo-lambda-chatbot-mvp"
      Layers:
        - arn:aws:lambda:eu-south-1:903877991199:layer:chatbotLayer:5
      Environment:
        Variables:
          PYTHONPATH: "/var/task"
    Metadata:
      BuildMethod: makefile

Outputs:
  DiaryFunction:
    Description: Trusted contacts lambda function ARN
    Value: !GetAtt DiaryFunction.Arn

  TrustedContactFunction:
    Description: Diary notes lambda function ARN
    Value: !GetAtt TrustedContactFunction.Arn

  TrustedContactsTable:
    Description: DynamoDB Table Name
    Value: !Ref TrustedContactsTable

  ChatbotFunction:
    Description: Chatbot lambda function ARN
    Value: !GetAtt ChatbotFunction.Arn

  ChatsTable:
    Description: Chats Table Name
    Value: !Ref ChatsTable

  ChatsMessagesTable:
    Description: Chats Messages Table Name
    Value: !Ref ChatsMessagesTable
